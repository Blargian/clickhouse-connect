name: 'Verify Docs'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Mintlify Validate
    steps:
      - name: Checkout clickhouse-connect
        uses: actions/checkout@v4

      - name: Sparse-checkout full docs from core repo
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Blargian/ClickHouse-Mintlify-test.git \
            /tmp/core-docs
          cd /tmp/core-docs
          git sparse-checkout set docs

      - name: Overlay clickhouse-connect docs into core docs
        run: |
          cp -r /tmp/core-docs/docs /tmp/docs-build
          cp -r docs/* /tmp/docs-build/docs/language-clients/python/

      - name: Install Mintlify CLI
        run: npm i -g mint

      - name: Validate docs
        working-directory: /tmp/docs-build
        run: mint validate
