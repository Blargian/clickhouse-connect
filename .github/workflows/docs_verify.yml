name: 'Verify Docs'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Mintlify checks
    steps:
      - name: Checkout clickhouse-connect
        uses: actions/checkout@v4

      # The driver pulls the docs-builder image (which provides `mint`), sparse-
      # clones the aggregator docs repo plus its shared check scripts, replaces
      # the Python client folder with this repo's docs/, and runs the checks
      # (mint validate + mint broken-links) inside the image. It exits non-zero
      # if any check fails, so a green step means every check passed.
      - name: Run Mintlify docs checks
        run: |
          python3 .github/scripts/mintlify_docs_check.py \
            --repo https://github.com/ClickHouse/ClickHouse.git \
            --ref master \
            --replace docs:integrations/language-clients/python